version: 2.1

jobs:
  build:
    macos:
      xcode: "14.3"
    working_directory: ~/project
    steps:
      - checkout
      
      - run:
          name: Install XcodeGen
          command: brew install xcodegen
      
      - run:
          name: Generate Xcode Project
          command: xcodegen generate
      
      - run:
          name: Build iOS App
          command: |
            xcodebuild -project LauncherApp.xcodeproj -scheme LauncherApp -configuration Debug -destination 'generic/platform=iOS Simulator' build
      
      - run:
          name: Build iOS Archive
          command: |
            xcodebuild -project LauncherApp.xcodeproj -scheme LauncherApp -configuration Release -destination 'generic/platform=iOS' archive -archivePath build/LiveContainer.xcarchive

      - run:
          name: Create Unsigned IPA
          command: |
            # Create unsigned IPA manually from archive
            ARCHIVE_PATH="build/LiveContainer.xcarchive"
            APP_PATH="$ARCHIVE_PATH/Products/Applications/LauncherApp.app"
            
            # Debug: list what's in the archive
            echo "=== Archive contents ==="
            ls -la "$ARCHIVE_PATH/"
            echo ""
            echo "=== App bundle contents ==="
            ls -la "$APP_PATH/"
            echo ""
            echo "=== Resources in app bundle ==="
            ls -la "$APP_PATH/Resources/" 2>/dev/null || echo "No Resources folder"
            echo ""
            echo "=== Looking for index.htm ==="
            find "$APP_PATH" -name "*.htm*" -o -name "index.*" 2>/dev/null || echo "No HTML files found"
            
            # Create Payload directory and copy .app
            mkdir -p build/Payload
            cp -R "$APP_PATH" build/Payload/
            
            # Create unsigned IPA from within build directory
            cd build
            zip -r LiveContainer.ipa Payload/
            cd ..
            
            # Cleanup
            rm -rf build/Payload
            
            echo ""
            echo "Unsigned IPA created: build/LiveContainer.ipa"
            ls -la build/LiveContainer.ipa

      - store_artifacts:
          path: build/LiveContainer.ipa
          destination: LauncherApp.ipa

workflows:
  version: 2
  build-workflow:
    jobs:
      - build