version: 2.1

jobs:
  build:
    macos:
      xcode: "14.3"
    working_directory: ~/project
    steps:
      - checkout
      
      - run:
          name: Install XcodeGen
          command: brew install xcodegen
      
      - run:
          name: Generate Xcode Project
          command: xcodegen generate
      
      - run:
          name: Build iOS App
          command: |
            xcodebuild -project LauncherApp.xcodeproj -scheme LauncherApp -configuration Debug -destination 'generic/platform=iOS Simulator' build
      
      - run:
          name: Build iOS Archive
          command: |
            xcodebuild -project LauncherApp.xcodeproj -scheme LauncherApp -configuration Release -destination 'generic/platform=iOS' archive -archivePath build/LiveContainer.xcarchive
            # Note: IPA export skipped - requires Apple Developer account for provisioning profiles
            # The .xcarchive can be signed and exported on a machine with proper credentials

      - store_artifacts:
          path: build/LiveContainer.xcarchive
          destination: LiveContainer.xcarchive
          prefix: build

workflows:
  version: 2
  build-workflow:
    jobs:
      - build