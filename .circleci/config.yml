version: 2.1

jobs:
  build:
    macos:
      xcode: "14.3"
    working_directory: ~/project
    steps:
      - checkout
      
      - run:
          name: Install XcodeGen
          command: brew install xcodegen
      
      - run:
          name: Generate Xcode Project
          command: xcodegen generate
      
      - run:
          name: Build iOS App
          command: |
            xcodebuild -project LauncherApp.xcodeproj -scheme LauncherApp -configuration Debug -destination 'generic/platform=iOS Simulator' build
      
      - run:
          name: Build and Export iOS IPA (Unsigned)
          command: |
            xcodebuild -project LauncherApp.xcodeproj -scheme LauncherApp -configuration Release -destination 'generic/platform=iOS' archive -archivePath build/LiveContainer.xcarchive
            # Export as unsigned IPA - can be re-signed with esign
            xcodebuild -exportArchive \
              -archivePath build/LiveContainer.xcarchive \
              -exportOptionsPlist exportOptions.plist \
              -exportPath build \
              CODE_SIGN_IDENTITY="-" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO

      - store_artifacts:
          path: build/LiveContainer.ipa
          destination: LauncherApp.ipa

workflows:
  version: 2
  build-workflow:
    jobs:
      - build