version: 2.1

jobs:
  build:
    macos:
      xcode: "14.3"
    working_directory: ~/project
    steps:
      - checkout
      
      - run:
          name: Install XcodeGen
          command: brew install xcodegen
      
      - run:
          name: Generate Xcode Project
          command: xcodegen generate
      
      - run:
          name: Build iOS App
          command: |
            xcodebuild -project LauncherApp.xcodeproj -scheme LauncherApp -configuration Debug -destination 'generic/platform=iOS Simulator' build
      
      - run:
          name: Build iOS Archive
          command: |
            xcodebuild -project LauncherApp.xcodeproj -scheme LauncherApp -configuration Release -destination 'generic/platform=iOS' archive -archivePath build/LiveContainer.xcarchive

      - run:
          name: Create Unsigned IPA
          command: |
            # Create unsigned IPA manually from archive
            ARCHIVE_PATH="build/LiveContainer.xcarchive"
            APP_PATH="$ARCHIVE_PATH/Products/Applications/LauncherApp.app"
            IPA_PATH="build/LiveContainer.ipa"
            
            # Create Payload directory
            mkdir -p build/Payload
            
            # Copy .app to Payload folder
            cp -R "$APP_PATH" build/Payload/
            
            # Create unsigned IPA
            cd build && zip -r "$IPA_PATH" Payload/
            
            # Cleanup
            rm -rf Payload
            
            echo "Unsigned IPA created: $IPA_PATH"
            ls -la "$IPA_PATH"

      - store_artifacts:
          path: build/LiveContainer.ipa
          destination: LauncherApp.ipa

workflows:
  version: 2
  build-workflow:
    jobs:
      - build