version: 2.1

jobs:
  build:
    macos:
      xcode: "15.0.0"
    working_directory: ~/project
    steps:
      - checkout
      
      - run:
          name: Install XcodeGen
          command: brew install xcodegen
      
      - run:
          name: Generate Xcode Project
          command: |
            cd LauncherApp
            xcodegen generate
      
      - run:
          name: Build iOS App
          command: |
            cd LauncherApp
            xcodebuild -project LauncherApp.xcodeproj -scheme LauncherApp -configuration Debug -destination 'generic/platform=iOS Simulator' build
      
      - run:
          name: Create IPA
          command: |
            cd LauncherApp
            xcodebuild -project LauncherApp.xcodeproj -scheme LauncherApp -configuration Release -destination 'generic/platform=iOS' archive -archivePath build/LiveContainer.xcarchive
            xcodebuild -exportArchive -archivePath build/LiveContainer.xcarchive -exportOptionsPlist exportOptions.plist -exportPath .

      - store_artifacts:
          path: LauncherApp/LiveContainer.ipa
          destination: LauncherApp.ipa

workflows:
  version: 2
  build-workflow:
    jobs:
      - build